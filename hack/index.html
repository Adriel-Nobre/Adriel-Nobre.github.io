<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Hack the Code</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

body {
    min-height: 100vh;

    font-family:
        "Courier New",
        monospace;

    background:
        radial-gradient(
            circle at top,
            #052e16,
            #020617 55%
        );

    color: #22c55e;

    display: flex;

    justify-content: center;

    align-items: flex-start;

    padding: 20px;

    overflow-y: auto;
}

        .game {

            width: 100%;

            max-width: 650px;

            text-align: center;
        }

        .terminal {

            padding: 30px;

            background:
                rgba(2, 6, 23, 0.95);

            border:
                1px solid
                rgba(34, 197, 94, 0.35);

            border-radius: 20px;

            box-shadow:
                0 0 40px
                rgba(34, 197, 94, 0.08);
        }

        h1 {

            font-size: 38px;

            margin-bottom: 8px;

            text-shadow:
                0 0 15px
                rgba(34, 197, 94, 0.6);
        }

        .subtitle {

            color: #86efac;

            margin-bottom: 25px;
        }

        .difficulty {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 25px;
        }

        .time-button {

            border: 1px solid #166534;

            border-radius: 10px;

            padding: 10px 20px;

            background: #020617;

            color: #86efac;

            font-family:
                "Courier New",
                monospace;

            font-weight: bold;

            cursor: pointer;
        }

        .time-button:hover {

            border-color: #22c55e;
        }

        .time-button.active {

            background: #166534;

            color: white;

            border-color: #22c55e;

            box-shadow:
                0 0 12px
                rgba(34, 197, 94, 0.25);
        }

        .status {

            display: flex;

            justify-content: space-between;

            margin-bottom: 20px;

            color: #94a3b8;

            font-size: 14px;
        }

        .status strong {

            color: #22c55e;
        }

        .timer {

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 20px;
        }

        .timer.warning {

            color: #facc15;
        }

        .timer.danger {

            color: #ef4444;

            animation:
                blink
                0.5s
                infinite
                alternate;
        }

        @keyframes blink {

            from {
                opacity: 1;
            }

            to {
                opacity: 0.4;
            }
        }

        .screen {

            padding: 22px;

            margin-bottom: 20px;

            border-radius: 12px;

            background: #020617;

            border:
                1px solid
                rgba(34, 197, 94, 0.2);

            text-align: left;
        }

        .screen-title {

            color: #64748b;

            font-size: 12px;

            margin-bottom: 15px;

            text-align: center;
        }

        .code {

            text-align: center;

            font-size: 38px;

            letter-spacing: 12px;

            color: #f8fafc;

            margin-bottom: 22px;
        }

        .hints-title {

            color: #22c55e;

            font-weight: bold;

            margin-bottom: 10px;
        }

        .hint {

            color: #cbd5e1;

            font-size: 14px;

            line-height: 1.6;

            margin: 5px 0;
        }

        .input-area {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 20px;
        }

        .digit {

            width: 60px;

            height: 60px;

            border-radius: 10px;

            border:
                1px solid
                #166534;

            background: #020617;

            color: #22c55e;

            font-family:
                "Courier New",
                monospace;

            font-size: 26px;

            text-align: center;

            outline: none;
        }

        .digit:focus {

            border-color: #22c55e;

            box-shadow:
                0 0 12px
                rgba(34, 197, 94, 0.3);
        }

        .buttons {

            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        button.action {

            border: none;

            border-radius: 10px;

            padding: 13px 20px;

            font-family:
                "Courier New",
                monospace;

            font-weight: bold;

            cursor: pointer;
        }

        .hack-button {

            background: #16a34a;

            color: white;
        }

        .hack-button:hover {

            background: #22c55e;
        }

        .restart-button {

            background: #334155;

            color: white;
        }

        .restart-button:hover {

            background: #475569;
        }

        .message {

            min-height: 25px;

            margin-top: 20px;

            color: #94a3b8;
        }

        .result {

            display: none;

            margin-top: 25px;

            padding: 25px;

            border-radius: 16px;

            background: #020617;

            border:
                1px solid
                rgba(34, 197, 94, 0.25);
        }

        .result h2 {

            margin-bottom: 15px;
        }

        .result p {

            color: #cbd5e1;

            margin: 7px;
        }

        .success {

            color: #22c55e;
        }

        .failure {

            color: #ef4444;
        }

        .record {

            color: #facc15 !important;

            font-weight: bold;
        }

        .win-gif {

            width: 100%;

            max-width: 250px;

            border-radius: 12px;

            border:
                2px solid
                rgba(34, 197, 94, 0.5);

            box-shadow:
                0 0 20px
                rgba(34, 197, 94, 0.35);

            display: block;

            margin: 12px auto 16px;
        }

        .result-buttons {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 15px;

            flex-wrap: wrap;
        }

        .extra-hint-box {

            margin-top: 18px;

            padding: 12px 16px;

            border-radius: 10px;

            text-align: center;

            transition: all 0.3s ease;
        }

        .extra-hint-box.locked {

            background: rgba(2, 6, 23, 0.6);

            border: 1px dashed rgba(100, 116, 139, 0.4);
        }

        .extra-hint-box.locked .extra-hint-header {

            color: #64748b;

            font-weight: bold;

            font-size: 13px;

            margin-bottom: 4px;
        }

        .extra-hint-box.locked .extra-hint-content {

            color: #94a3b8;

            font-size: 13px;
        }

        .extra-hint-box.ready {

            background: rgba(250, 204, 21, 0.08);

            border: 1px solid #facc15;

            animation: hintPulse 1.5s infinite ease-in-out;
        }

        .extra-hint-box.ready .extra-hint-header {

            color: #facc15;

            font-weight: bold;

            font-size: 13px;

            letter-spacing: 1px;

            margin-bottom: 8px;

            text-shadow: 0 0 8px rgba(250, 204, 21, 0.5);
        }

        .extra-hint-btn {

            background: #eab308;

            color: #020617;

            border: none;

            border-radius: 8px;

            padding: 8px 16px;

            font-family:
                "Courier New",
                monospace;

            font-weight: bold;

            font-size: 13px;

            cursor: pointer;

            box-shadow: 0 0 10px rgba(250, 204, 21, 0.4);

            transition: all 0.2s ease;
        }

        .extra-hint-btn:hover {

            background: #facc15;

            transform: scale(1.04);

            box-shadow: 0 0 15px rgba(250, 204, 21, 0.7);
        }

        .extra-hint-box.revealed {

            background: rgba(34, 197, 94, 0.08);

            border: 1px solid rgba(34, 197, 94, 0.4);

            box-shadow: 0 0 15px rgba(34, 197, 94, 0.1);
        }

        .extra-hint-box.revealed .extra-hint-header {

            color: #22c55e;

            font-weight: bold;

            font-size: 13px;

            margin-bottom: 6px;

            text-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
        }

        .extra-hint-box.revealed .extra-hint-content {

            color: #86efac;

            font-size: 13.5px;

            line-height: 1.5;
        }

        @keyframes hintPulse {

            0% {
                box-shadow: 0 0 6px rgba(250, 204, 21, 0.25);
                border-color: rgba(250, 204, 21, 0.6);
            }

            50% {
                box-shadow: 0 0 16px rgba(250, 204, 21, 0.5);
                border-color: #facc15;
            }

            100% {
                box-shadow: 0 0 6px rgba(250, 204, 21, 0.25);
                border-color: rgba(250, 204, 21, 0.6);
            }
        }

@media (max-width: 500px) {

    body {
        display: block;
        padding: 12px;
    }

    .game {
        max-width: 100%;
        padding-bottom: 30px;
    }

    .terminal {
        padding: 18px 14px;
        border-radius: 16px;
    }

    h1 {
        font-size: 27px;
        margin-bottom: 6px;
    }

    .subtitle {
        font-size: 12px;
        margin-bottom: 18px;
    }

    .difficulty {
        gap: 6px;
    }

    .time-button {
        padding: 9px 10px;
        font-size: 11px;
    }

    .status {
        margin-bottom: 12px;
        font-size: 12px;
    }

    .timer {
        font-size: 26px;
        margin-bottom: 15px;
    }

    .screen {
        padding: 16px;
        margin-bottom: 15px;
    }

    .code {
        font-size: 28px;
        letter-spacing: 6px;
        margin-bottom: 16px;
    }

    .hint {
        font-size: 12px;
        line-height: 1.5;
    }

    .input-area {
        gap: 7px;
        margin-bottom: 15px;
    }

    .digit {
        width: 52px;
        height: 52px;
        font-size: 23px;
    }

    .buttons {
        gap: 7px;
    }

    button.action {
        padding: 11px 13px;
        font-size: 12px;
    }

    .message {
        margin-top: 14px;
        font-size: 13px;
    }

    .result {
        margin-top: 18px;
        padding: 20px 15px;
    }

    .extra-hint-box {
        margin-top: 12px;
        padding: 10px 12px;
    }

    .extra-hint-box.locked .extra-hint-header,
    .extra-hint-box.ready .extra-hint-header,
    .extra-hint-box.revealed .extra-hint-header {
        font-size: 12px;
    }

    .extra-hint-box.locked .extra-hint-content,
    .extra-hint-box.revealed .extra-hint-content,
    .extra-hint-btn {
        font-size: 12px;
        padding: 7px 12px;
    }
}

    </style>

</head>


<body>


<div class="game">

    <div class="terminal">


        <h1>💻 HACK THE CODE</h1>

        <p class="subtitle">
            SYSTEM SECURITY TERMINAL
        </p>


        <!-- ESCOLHA DE TEMPO -->

        <div class="difficulty">

            <button
                id="time30"
                class="time-button active"
                onclick="selectTime(30)"
            >
                ⏱️ 30 SEGUNDOS
            </button>

            <button
                id="time60"
                class="time-button"
                onclick="selectTime(60)"
            >
                ⏱️ 60 SEGUNDOS
            </button>

        </div>


        <div class="status">

            <span>
                NÍVEL:
                <strong>1</strong>
            </span>

            <span>
                TENTATIVAS:
                <strong id="attempts">0</strong>
            </span>

        </div>


        <div id="timer" class="timer">
            30s
        </div>


        <div class="screen">

            <div class="screen-title">
                🔐 ENCRYPTED ACCESS CODE
            </div>


            <div
                id="codeDisplay"
                class="code"
            >
                _ _ _ _
            </div>


            <div class="hints-title">
                💡 PISTAS
            </div>


            <div
                id="hints"
            ></div>


            <!-- DICA EXTRA -->

            <div
                id="extraHintBox"
                class="extra-hint-box locked"
            ></div>

        </div>


        <div class="input-area">

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

        </div>


        <div class="buttons">

            <button
                class="action hack-button"
                onclick="checkCode()"
            >
                ⚡ TENTAR INVADIR
            </button>


            <button
                class="action restart-button"
                onclick="startGame()"
            >
                🔄 NOVO CÓDIGO
            </button>


            <button
                class="action restart-button"
                onclick="goBack()"
            >
                ← VOLTAR
            </button>

        </div>


        <div
            id="message"
            class="message"
        >
            Sistema pronto.
        </div>


        <div
            id="result"
            class="result"
        >

            <h2 id="resultTitle"></h2>

            <div
                id="winGifContainer"
                style="display: none;"
            >
                <img
                    src="../gif/baby-win.gif"
                    alt="Parabéns pela vitória!"
                    class="win-gif"
                >
            </div>

            <p id="resultText"></p>

            <p>
                🎯 Tentativas:
                <strong id="finalAttempts"></strong>
            </p>

            <p>
                ⏱️ Tempo:
                <strong id="finalTime"></strong>
            </p>

            <p
                id="record"
                class="record"
            ></p>

            <div class="result-buttons">

                <button
                    class="action hack-button"
                    onclick="startGame()"
                >
                    💻 NOVO DESAFIO
                </button>

                <button
                    class="action restart-button"
                    onclick="goBack()"
                >
                    ← VOLTAR
                </button>

            </div>

        </div>


    </div>

</div>


<script>


    const inputs =
        document.querySelectorAll(".digit");


    const timerElement =
        document.getElementById("timer");


    const attemptsElement =
        document.getElementById("attempts");


    const messageElement =
        document.getElementById("message");


    const hintsElement =
        document.getElementById("hints");


    const resultElement =
        document.getElementById("result");


    const resultTitle =
        document.getElementById("resultTitle");


    const resultText =
        document.getElementById("resultText");


    const finalAttempts =
        document.getElementById("finalAttempts");


    const finalTime =
        document.getElementById("finalTime");


    const recordElement =
        document.getElementById("record");


    const winGifContainer =
        document.getElementById("winGifContainer");


    const extraHintBox =
        document.getElementById("extraHintBox");


    let secretCode = "";

    let attempts = 0;

    let timeLimit = 30;

    let timeLeft = 30;

    let timer = null;

    let gameActive = false;

    let startTime = null;

    let extraHintText = "";

    let extraHintAvailable = false;

    let extraHintRevealed = false;


    /*
        Gera um código de 4 números.
    */

    function generateCode() {

        let code = "";

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            code += Math.floor(
                Math.random() * 10
            );

        }

        return code;
    }


    /*
        Escolhe 30 ou 60 segundos.
    */

    function selectTime(seconds) {

        timeLimit = seconds;

        document
            .getElementById("time30")
            .classList
            .remove("active");

        document
            .getElementById("time60")
            .classList
            .remove("active");


        document
            .getElementById(
                seconds === 30
                    ? "time30"
                    : "time60"
            )
            .classList
            .add("active");


        startGame();
    }


    /*
        Cria as pistas com base
        no código atual.
    */

    function generateHints(code) {

        const hints = [];


        /*
            Pista 1:
            revela uma posição.
        */

        const position =
            Math.floor(
                Math.random() * 4
            );

        const positionNames = [
            "primeiro",
            "segundo",
            "terceiro",
            "quarto"
        ];

        hints.push(
            `• O ${positionNames[position]} número é ${code[position]}.`
        );


        /*
            Pista 2:
            informa se uma posição
            é par ou ímpar.
        */

        let parityPosition;

        do {

            parityPosition =
                Math.floor(
                    Math.random() * 4
                );

        } while (
            parityPosition === position
        );


        const parity =
            Number(
                code[parityPosition]
            ) % 2 === 0
                ? "par"
                : "ímpar";


        hints.push(
            `• O ${
                positionNames[parityPosition]
            } número é ${parity}.`
        );


        /*
            Pista 3:
            soma de duas posições.
        */

        let first =
            Math.floor(
                Math.random() * 4
            );

        let second =
            Math.floor(
                Math.random() * 4
            );


        while (
            second === first
        ) {

            second =
                Math.floor(
                    Math.random() * 4
                );
        }


        const sum =
            Number(code[first]) +
            Number(code[second]);


        hints.push(
            `• A soma do ${
                positionNames[first]
            } e do ${
                positionNames[second]
            } número é ${sum}.`
        );


        return {
            hints,
            revealedPosition: position,
            parityPosition: parityPosition,
            sumPositions: [first, second]
        };
    }


    /*
        Gera uma dica extra inteligente, útil e focada
        em um dígito que NÃO foi revelado nas pistas iniciais.
    */

    function generateExtraHint(code, hintsMeta) {

        const digits =
            code.split("").map(Number);

        const positionNames = [
            "primeiro",
            "segundo",
            "terceiro",
            "quarto"
        ];

        const revealedPos =
            hintsMeta
                ? hintsMeta.revealedPosition
                : -1;

        const parityPos =
            hintsMeta
                ? hintsMeta.parityPosition
                : -1;


        /*
            Candidatos: posições cujo número NÃO
            foi revelado diretamente pela Pista 1.
        */

        const unknownPositions =
            [0, 1, 2, 3].filter(
                p => p !== revealedPos
            );


        /*
            Prioriza as posições que também não receberam
            dica direta de paridade na Pista 2.
        */

        const leastHinted =
            unknownPositions.filter(
                p => p !== parityPos
            );

        const candidatePool =
            leastHinted.length > 0
                ? leastHinted
                : unknownPositions;


        /*
            Escolhe o dígito alvo desconhecido.
        */

        const targetPos =
            candidatePool[
                Math.floor(
                    Math.random() *
                    candidatePool.length
                )
            ];

        const targetVal =
            digits[targetPos];

        const targetName =
            positionNames[targetPos];

        const possibleHints = [];


        /*
            1. Faixa / Intervalo útil
        */

        if (
            targetVal >= 2 &&
            targetVal <= 7
        ) {

            possibleHints.push(
                `O ${targetName} número está entre ${targetVal - 2} e ${targetVal + 2}.`
            );

        }

        if (targetVal <= 4) {

            possibleHints.push(
                `O ${targetName} número é menor ou igual a 4.`
            );

        } else {

            possibleHints.push(
                `O ${targetName} número é maior ou igual a 5.`
            );

        }


        /*
            2. Paridade do número (se não tiver sido a pista de paridade)
        */

        if (targetPos !== parityPos) {

            const par =
                targetVal % 2 === 0
                    ? "par"
                    : "ímpar";

            possibleHints.push(
                `O ${targetName} número é ${par}.`
            );

        }


        /*
            3. Comparação com o número já revelado na Pista 1
        */

        if (revealedPos !== -1) {

            const revVal =
                digits[revealedPos];

            const revName =
                positionNames[revealedPos];

            if (targetVal > revVal) {

                possibleHints.push(
                    `O ${targetName} número é maior que o ${revName} (${revVal}).`
                );

            } else if (targetVal < revVal) {

                possibleHints.push(
                    `O ${targetName} número é menor que o ${revName} (${revVal}).`
                );

            } else {

                possibleHints.push(
                    `O ${targetName} número é igual ao ${revName} (${revVal}).`
                );

            }

        }


        /*
            4. Intervalo estreito adicional
        */

        if (
            targetVal >= 3 &&
            targetVal <= 8
        ) {

            possibleHints.push(
                `O ${targetName} número está entre ${targetVal - 1} e ${targetVal + 1}.`
            );

        }


        const chosen =
            possibleHints[
                Math.floor(
                    Math.random() *
                    possibleHints.length
                )
            ];

        return chosen;
    }


    /*
        Renderiza o estado da Dica Extra.
    */

    function renderExtraHint() {

        if (!extraHintBox) return;


        if (extraHintRevealed) {

            extraHintBox.className =
                "extra-hint-box revealed";

            extraHintBox.innerHTML = `
                <div class="extra-hint-header">⚡ DICA EXTRA</div>
                <div class="extra-hint-content">🔎 ${extraHintText}</div>
            `;

        } else if (extraHintAvailable) {

            extraHintBox.className =
                "extra-hint-box ready";

            extraHintBox.innerHTML = `
                <div class="extra-hint-header">⚡ DICA EXTRA LIBERADA!</div>
                <button type="button" class="extra-hint-btn" onclick="revealExtraHint()">🔍 REVELAR DICA</button>
            `;

        } else {

            const unlockThreshold =
                timeLimit === 60
                    ? 15
                    : 12;

            extraHintBox.className =
                "extra-hint-box locked";

            extraHintBox.innerHTML = `
                <div class="extra-hint-header">⚡ DICA EXTRA</div>
                <div class="extra-hint-content">🔒 Será liberada quando restarem ${unlockThreshold} segundos!</div>
            `;

        }

    }


    /*
        Revela a dica extra quando solicitada.
    */

    function revealExtraHint() {

        if (
            !gameActive ||
            !extraHintAvailable ||
            extraHintRevealed
        ) {
            return;
        }


        extraHintRevealed = true;

        renderExtraHint();
    }


    /*
        Inicia uma nova partida.
    */

    function startGame() {

        clearInterval(timer);


        secretCode =
            generateCode();


        attempts = 0;

        timeLeft =
            timeLimit;

        gameActive = true;

        startTime =
            Date.now();


        attemptsElement.textContent =
            "0";


        timerElement.textContent =
            timeLimit + "s";


        timerElement.className =
            "timer";


        messageElement.textContent =
            "Descubra o código.";


        resultElement.style.display =
            "none";


        if (winGifContainer) {

            winGifContainer.style.display =
                "none";

        }


        /*
            Gera novas pistas
            para o novo código.
        */

        const hintsData =
            generateHints(
                secretCode
            );


        hintsElement.innerHTML =
            hintsData.hints
                .map(
                    hint =>
                        `<div class="hint">${hint}</div>`
                )
                .join("");


        /*
            Inicializa a Dica Extra.
        */

        extraHintAvailable = false;

        extraHintRevealed = false;

        extraHintText =
            generateExtraHint(
                secretCode,
                hintsData
            );

        renderExtraHint();


        /*
            Limpa os campos.
        */

        inputs.forEach(input => {

            input.value = "";

            input.disabled = false;

        });


        inputs[0].focus();


        /*
            Começa o cronômetro.
        */

        timer =
            setInterval(
                updateTimer,
                1000
            );
    }


    /*
        Atualiza o tempo.
    */

    function updateTimer() {

        if (!gameActive) return;


        timeLeft--;


        timerElement.textContent =
            timeLeft + "s";


        const unlockThreshold =
            timeLimit === 60
                ? 15
                : 12;


        if (
            timeLeft <= unlockThreshold &&
            !extraHintAvailable &&
            !extraHintRevealed
        ) {

            extraHintAvailable = true;

            renderExtraHint();
        }


        if (timeLeft <= 15) {

            timerElement.className =
                "timer danger";

        } else if (
            timeLeft <= 30
        ) {

            timerElement.className =
                "timer warning";
        }


        if (timeLeft <= 0) {

            loseGame();
        }
    }


    /*
        Verifica a tentativa.
    */

    function checkCode() {

        if (!gameActive) return;


        let enteredCode = "";


        inputs.forEach(input => {

            enteredCode +=
                input.value;

        });


        if (
            enteredCode.length !== 4
        ) {

            messageElement.textContent =
                "⚠️ Digite os 4 números.";

            return;
        }


        attempts++;


        attemptsElement.textContent =
            attempts;


        /*
            Vitória.
        */

        if (
            enteredCode ===
            secretCode
        ) {

            winGame();

            return;
        }


        /*
            Conta números corretos
            na posição correta.
        */

        let correctPosition = 0;


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            if (
                enteredCode[i] ===
                secretCode[i]
            ) {

                correctPosition++;
            }
        }


        /*
            Mensagem de feedback.
        */

        if (
            correctPosition === 0
        ) {

            messageElement.textContent =
                "❌ Nenhum número está na posição correta.";

        } else {

            messageElement.textContent =
                `⚡ ${correctPosition} número(s) estão na posição correta.`;
        }


        /*
            Limpa tentativa.
        */

        inputs.forEach(input => {

            input.value = "";

        });


        inputs[0].focus();
    }


    /*
        Vitória.
    */

    function winGame() {

        gameActive = false;

        clearInterval(timer);


        const elapsed =
            Math.floor(
                (
                    Date.now() -
                    startTime
                ) / 1000
            );


        inputs.forEach(input => {

            input.disabled = true;

        });


        if (winGifContainer) {

            winGifContainer.style.display =
                "block";

        }


        resultTitle.textContent =
            "🎉 PARABÉNS! VOCÊ VENCEU!";


        resultTitle.className =
            "success";


        resultText.textContent =
            "Excelente! Você invadiu o sistema e quebrou o código!";


        finalAttempts.textContent =
            attempts;


        finalTime.textContent =
            elapsed + " segundos";


        saveRecord(elapsed);


        resultElement.style.display =
            "block";


        messageElement.textContent =
            "🔓 SISTEMA DESBLOQUEADO";
    }


    /*
        Derrota.
    */

    function loseGame() {

        gameActive = false;

        clearInterval(timer);


        inputs.forEach(input => {

            input.disabled = true;

        });


        if (winGifContainer) {

            winGifContainer.style.display =
                "none";

        }


        resultTitle.textContent =
            "🔴 ACCESS DENIED";


        resultTitle.className =
            "failure";


        resultText.textContent =
            "O sistema bloqueou o acesso.";


        finalAttempts.textContent =
            attempts;


        finalTime.textContent =
            timeLimit +
            " segundos";


        recordElement.textContent =
            "Código correto: " +
            secretCode;


        resultElement.style.display =
            "block";


        messageElement.textContent =
            "🚨 SISTEMA BLOQUEADO";
    }


    /*
        Recorde.
    */

    function saveRecord(time) {

        const recordKey =
            "hackTheCodeRecord_" +
            timeLimit;


        const oldRecord =
            localStorage.getItem(
                recordKey
            );


        if (
            oldRecord === null ||
            time < Number(oldRecord)
        ) {

            localStorage.setItem(
                recordKey,
                time
            );


            recordElement.textContent =
                "🏆 NOVO RECORDE!";

        } else {

            recordElement.textContent =
                "🏆 Recorde: " +
                oldRecord +
                " segundos";
        }
    }


    /*
        Digitação automática.
    */

    inputs.forEach(
        (input, index) => {

            input.addEventListener(
                "input",
                () => {

                    input.value =
                        input.value.replace(
                            /[^0-9]/g,
                            ""
                        );


                    if (
                        input.value &&
                        index <
                        inputs.length - 1
                    ) {

                        inputs[
                            index + 1
                        ].focus();
                    }

                }
            );


            input.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key ===
                        "Backspace" &&
                        !input.value &&
                        index > 0
                    ) {

                        inputs[
                            index - 1
                        ].focus();
                    }


                    if (
                        event.key ===
                        "Enter"
                    ) {

                        checkCode();
                    }

                }
            );

        }
    );


    /*
        Voltar para o Lab.
    */

    function goBack() {

        window.location.href =
            "../";
    }


    /*
        Começa a primeira partida.
    */

    startGame();

</script>
