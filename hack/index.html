<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hack the Code</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Courier New", monospace;
            background:
                radial-gradient(circle at top, #052e16, #020617 55%);
            color: #22c55e;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .game {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .terminal {
            padding: 30px;

            background: rgba(2, 6, 23, 0.92);

            border: 1px solid rgba(34, 197, 94, 0.35);

            border-radius: 20px;

            box-shadow:
                0 0 40px rgba(34, 197, 94, 0.08);
        }

        h1 {
            font-size: 38px;
            margin-bottom: 8px;

            text-shadow:
                0 0 15px rgba(34, 197, 94, 0.6);
        }

        .subtitle {
            color: #86efac;
            margin-bottom: 25px;
        }

        .status {
            display: flex;
            justify-content: space-between;

            margin-bottom: 20px;

            color: #94a3b8;
            font-size: 14px;
        }

        .status strong {
            color: #22c55e;
        }

        .timer {
            font-size: 26px;
            font-weight: bold;

            margin-bottom: 25px;
        }

        .timer.warning {
            color: #facc15;
        }

        .timer.danger {
            color: #ef4444;

            animation: blink 0.5s infinite alternate;
        }

        @keyframes blink {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.4;
            }
        }

        .screen {
            padding: 20px;

            margin-bottom: 20px;

            border-radius: 12px;

            background: #020617;

            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .screen-title {
            color: #64748b;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .code {
            font-size: 38px;
            letter-spacing: 12px;

            color: #f8fafc;

            min-height: 45px;
        }

        .hint {
            margin-top: 15px;

            color: #94a3b8;

            font-size: 14px;

            line-height: 1.5;
        }

        .input-area {
            display: flex;
            justify-content: center;

            gap: 10px;

            margin-bottom: 20px;
        }

        .digit {
            width: 60px;
            height: 60px;

            border-radius: 10px;

            border: 1px solid #166534;

            background: #020617;

            color: #22c55e;

            font-family: "Courier New", monospace;

            font-size: 26px;

            text-align: center;

            outline: none;
        }

        .digit:focus {
            border-color: #22c55e;

            box-shadow:
                0 0 12px rgba(34, 197, 94, 0.3);
        }

        .buttons {
            display: flex;

            justify-content: center;

            gap: 10px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            border-radius: 10px;

            padding: 13px 20px;

            font-family: "Courier New", monospace;

            font-weight: bold;

            cursor: pointer;
        }

        .hack-button {
            background: #16a34a;

            color: white;
        }

        .hack-button:hover {
            background: #22c55e;
        }

        .restart-button {
            background: #334155;

            color: white;
        }

        .restart-button:hover {
            background: #475569;
        }

        .message {
            min-height: 25px;

            margin-top: 20px;

            color: #94a3b8;
        }

        .result {
            display: none;

            margin-top: 25px;

            padding: 25px;

            border-radius: 16px;

            background: #020617;

            border: 1px solid rgba(34, 197, 94, 0.25);
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .result p {
            color: #cbd5e1;

            margin: 7px;
        }

        .success {
            color: #22c55e;
        }

        .failure {
            color: #ef4444;
        }

        .record {
            color: #facc15 !important;

            font-weight: bold;
        }

        @media (max-width: 500px) {

            .terminal {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

            .digit {
                width: 55px;
                height: 55px;
            }

            .code {
                font-size: 30px;
                letter-spacing: 7px;
            }
        }
    </style>
</head>

<body>

<div class="game">

    <div class="terminal">

        <h1>💻 HACK THE CODE</h1>

        <p class="subtitle">
            SYSTEM SECURITY TERMINAL
        </p>

        <div class="status">

            <span>
                NÍVEL:
                <strong id="level">1</strong>
            </span>

            <span>
                TENTATIVAS:
                <strong id="attempts">0</strong>
            </span>

        </div>

        <div id="timer" class="timer">
            30s
        </div>

        <div class="screen">

            <div class="screen-title">
                🔐 ENCRYPTED ACCESS CODE
            </div>

            <div id="codeDisplay" class="code">
                _ _ _ _
            </div>

            <div id="hint" class="hint">
                Descubra o código de 4 dígitos.
            </div>

        </div>

        <div class="input-area">

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

            <input
                class="digit"
                maxlength="1"
                inputmode="numeric"
                type="text"
            >

        </div>

        <div class="buttons">

            <button
                class="hack-button"
                onclick="checkCode()"
            >
                ⚡ TENTAR INVADIR
            </button>

            <button
                class="restart-button"
                onclick="startGame()"
            >
                🔄 REINICIAR
            </button>

            <button
                class="restart-button"
                onclick="goBack()"
            >
                ← VOLTAR
            </button>

        </div>

        <div id="message" class="message">
            Aguardando tentativa...
        </div>

        <div id="result" class="result">

            <h2 id="resultTitle"></h2>

            <p id="resultText"></p>

            <p>
                🎯 Tentativas:
                <strong id="finalAttempts"></strong>
            </p>

            <p>
                ⏱️ Tempo:
                <strong id="finalTime"></strong>
            </p>

            <p
                id="record"
                class="record"
            ></p>

            <br>

            <button
                class="hack-button"
                onclick="startGame()"
            >
                💻 TENTAR NOVAMENTE
            </button>

        </div>

    </div>

</div>


<script>

    const inputs =
        document.querySelectorAll(".digit");

    const timerElement =
        document.getElementById("timer");

    const levelElement =
        document.getElementById("level");

    const attemptsElement =
        document.getElementById("attempts");

    const messageElement =
        document.getElementById("message");

    const resultElement =
        document.getElementById("result");

    const resultTitle =
        document.getElementById("resultTitle");

    const resultText =
        document.getElementById("resultText");

    const finalAttempts =
        document.getElementById("finalAttempts");

    const finalTime =
        document.getElementById("finalTime");

    const recordElement =
        document.getElementById("record");

    let secretCode = "";

    let attempts = 0;

    let timeLeft = 60;

    let timer = null;

    let gameActive = false;

    let startTime = null;


    function generateCode() {

        let code = "";

        for (let i = 0; i < 4; i++) {

            code += Math.floor(
                Math.random() * 10
            );

        }

        return code;
    }


    function startGame() {

        clearInterval(timer);

        secretCode = generateCode();

        attempts = 0;

        timeLeft = 60;

        gameActive = true;

        startTime = Date.now();

        attemptsElement.textContent = "0";

        levelElement.textContent = "1";

        timerElement.textContent = "60s";

        timerElement.className = "timer";

        messageElement.textContent =
            "Aguardando tentativa...";

        resultElement.style.display =
            "none";

        inputs.forEach(input => {
            input.value = "";
            input.disabled = false;
        });

        inputs[0].focus();

        timer = setInterval(updateTimer, 1000);
    }


    function updateTimer() {

        if (!gameActive) return;

        timeLeft--;

        timerElement.textContent =
            timeLeft + "s";

        if (timeLeft <= 15) {

            timerElement.className =
                "timer danger";

        } else if (timeLeft <= 30) {

            timerElement.className =
                "timer warning";
        }

        if (timeLeft <= 0) {

            loseGame();
        }
    }


    function checkCode() {

        if (!gameActive) return;

        let enteredCode = "";

        inputs.forEach(input => {
            enteredCode += input.value;
        });

        if (enteredCode.length !== 4) {

            messageElement.textContent =
                "⚠️ Digite os 4 números.";

            return;
        }

        attempts++;

        attemptsElement.textContent =
            attempts;

        if (enteredCode === secretCode) {

            winGame();

            return;
        }

        let correctPosition = 0;

        let correctNumber = 0;

        for (let i = 0; i < 4; i++) {

            if (
                enteredCode[i] ===
                secretCode[i]
            ) {

                correctPosition++;

            } else if (
                secretCode.includes(
                    enteredCode[i]
                )
            ) {

                correctNumber++;
            }
        }

        messageElement.textContent =
            `❌ Código incorreto. ` +
            `${correctPosition} número(s) na posição correta. ` +
            `${correctNumber} número(s) existem no código.`;

        inputs.forEach(input => {
            input.value = "";
        });

        inputs[0].focus();
    }


    function winGame() {

        gameActive = false;

        clearInterval(timer);

        const elapsed =
            Math.floor(
                (Date.now() - startTime) / 1000
            );

        inputs.forEach(input => {
            input.disabled = true;
        });

        resultTitle.textContent =
            "🟢 ACCESS GRANTED";

        resultTitle.className =
            "success";

        resultText.textContent =
            "Você invadiu o sistema!";

        finalAttempts.textContent =
            attempts;

        finalTime.textContent =
            elapsed + " segundos";

        saveRecord(elapsed);

        resultElement.style.display =
            "block";

        messageElement.textContent =
            "🔓 SISTEMA DESBLOQUEADO";
    }


    function loseGame() {

        gameActive = false;

        clearInterval(timer);

        inputs.forEach(input => {
            input.disabled = true;
        });

        resultTitle.textContent =
            "🔴 ACCESS DENIED";

        resultTitle.className =
            "failure";

        resultText.textContent =
            "O sistema bloqueou o acesso.";

        finalAttempts.textContent =
            attempts;

        finalTime.textContent =
            "60 segundos";

        recordElement.textContent =
            "Código correto: " + secretCode;

        resultElement.style.display =
            "block";

        messageElement.textContent =
            "🚨 SISTEMA BLOQUEADO";
    }


    function saveRecord(time) {

        const oldRecord =
            localStorage.getItem(
                "hackTheCodeRecord"
            );

        if (
            oldRecord === null ||
            time < Number(oldRecord)
        ) {

            localStorage.setItem(
                "hackTheCodeRecord",
                time
            );

            recordElement.textContent =
                "🏆 NOVO RECORDE!";
        } else {

            recordElement.textContent =
                "🏆 Recorde: " +
                oldRecord +
                " segundos";
        }
    }


    inputs.forEach((input, index) => {

        input.addEventListener(
            "input",
            () => {

                input.value =
                    input.value.replace(
                        /[^0-9]/g,
                        ""
                    );

                if (
                    input.value &&
                    index < inputs.length - 1
                ) {

                    inputs[index + 1].focus();
                }
            }
        );

        input.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Backspace" &&
                    !input.value &&
                    index > 0
                ) {

                    inputs[index - 1].focus();
                }

                if (event.key === "Enter") {
                    checkCode();
                }
            }
        );

    });


    function goBack() {

        window.location.href = "../";
    }


    startGame();

</script>

</body>
</html>
