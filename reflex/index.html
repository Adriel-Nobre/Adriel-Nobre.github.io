<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nobre Reflex</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111827;
            color: white;

            user-select: none;
        }

        .game {
            width: 100%;
            max-width: 500px;
            min-height: 600px;

            padding: 30px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 40px;
        }

        #gameArea {
            width: 100%;
            height: 300px;

            border-radius: 25px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #374151;

            cursor: pointer;

            transition: background 0.15s;
        }

        #gameArea.waiting {
            background: #dc2626;
        }

        #gameArea.ready {
            background: #16a34a;
        }

        #message {
            font-size: 28px;
            font-weight: bold;
        }

        #result {
            margin-top: 30px;
            font-size: 22px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 15px 28px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        .action:hover {
            background: #1d4ed8;
        }

        .action.back {
            background: #374151;
        }

        .action.back:hover {
            background: #4b5563;
        }

        .hidden {
            display: none;
        }

        .record {
            margin-top: 20px;
            color: #facc15;
        }
    </style>
</head>

<body>

<div class="game">

    <h1>⚡ Nobre Reflex</h1>

    <p class="subtitle">
        Teste a velocidade dos seus reflexos.
    </p>

    <div id="gameArea">
        <span id="message">
            Clique para começar
        </span>
    </div>

    <div id="result"></div>

    <div id="record" class="record">
        🏆 Recorde: -- ms
    </div>

    <div class="buttons">
        <button id="restart" class="action">
            Começar
        </button>

        <a href="../index.html" class="action back" onclick="goBack(event)">
            ← Voltar
        </a>
    </div>

</div>

<script>

    const gameArea = document.getElementById("gameArea");
    const message = document.getElementById("message");
    const result = document.getElementById("result");
    const recordElement = document.getElementById("record");
    const restartButton = document.getElementById("restart");

    let startTime = 0;
    let timeout = null;
    let waiting = false;
    let ready = false;

    let record = null;

    restartButton.addEventListener("click", startGame);

    gameArea.addEventListener("click", () => {

        if (!waiting && !ready) {
            startGame();
            return;
        }

        if (waiting) {

            clearTimeout(timeout);

            waiting = false;
            ready = false;

            gameArea.classList.remove("waiting");

            message.textContent = "❌ Cedo demais!";

            result.textContent =
                "Você clicou antes da hora.";

            return;
        }

        if (ready) {

            const reactionTime =
                Date.now() - startTime;

            ready = false;

            gameArea.classList.remove("ready");

            message.textContent = "⚡ " + reactionTime + " ms";

            result.textContent =
                getMessage(reactionTime);

            if (record === null || reactionTime < record) {

                record = reactionTime;

                recordElement.textContent =
                    "🏆 Recorde: " + record + " ms";
            }

            restartButton.textContent =
                "Jogar novamente";
        }

    });

    function startGame() {

        clearTimeout(timeout);

        waiting = true;
        ready = false;

        result.textContent = "";

        restartButton.textContent = "Aguardando...";

        gameArea.classList.remove("ready");
        gameArea.classList.add("waiting");

        message.textContent = "🔴 ESPERE...";

        const delay =
            Math.floor(Math.random() * 3000) + 2000;

        timeout = setTimeout(() => {

            waiting = false;
            ready = true;

            gameArea.classList.remove("waiting");
            gameArea.classList.add("ready");

            message.textContent = "🟢 CLIQUE!";

            startTime = Date.now();

            restartButton.textContent =
                "Clique no verde!";

        }, delay);
    }

    function getMessage(time) {

        if (time < 180) {
            return "🔥 Insano! Reflexos de máquina.";
        }

        if (time < 250) {
            return "⚡ Muito rápido!";
        }

        if (time < 350) {
            return "😎 Nada mal!";
        }

        if (time < 500) {
            return "😂 Dá para melhorar!";
        }

        return "🐌 O Windows iniciou mais rápido.";
    }

    function goBack(event) {
        if (event) {
            event.preventDefault();
        }

        if (
            window.history.length > 1 &&
            document.referrer &&
            document.referrer.includes(window.location.host)
        ) {
            window.history.back();
        } else {
            window.location.href = "../index.html";
        }
    }

</script>

</body>
</html>
